[project]
name = "blistro-ai"
version = "0.1.0"
description = "Agentic RAG service for Blistro: LangGraph agent, hybrid retrieval, evals"
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.3.2",
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "langchain-core>=1.8.5",
    "langchain-openai>=1.8.5",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "numpy>=2.5.5",
    "openai>=3.60.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.2",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local-rerank = [
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
